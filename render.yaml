# Render Blueprint: New > Blueprint > pick this repo. Values marked sync: false are asked for on first deploy.
services:
  - type: web
    name: hireloop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_FIREBASE_APIKEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      # optional: automatic emails. On Render's free plan use Brevo (BREVO_API_KEY + MAIL_FROM);
      # SMTP_USER / SMTP_PASS (Gmail) work where outgoing mail ports aren't blocked. Email links use CLIENT_URL.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
