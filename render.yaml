# Render Blueprint: New > Blueprint > pick this repo. Values marked sync: false are asked for on first deploy.
services:
  - type: web
    name: hireloop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_FIREBASE_APIKEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      # optional: automatic emails (Gmail address + app password); links in emails use CLIENT_URL
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
